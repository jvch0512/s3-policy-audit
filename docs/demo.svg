<svg xmlns="http://www.w3.org/2000/svg" width="860" height="484" viewBox="0 0 860 484" role="img" aria-label="Terminal replay of s3-policy-audit on its sample data"><style>text{font:14px ui-monospace,Menlo,Consolas,monospace;fill:#d6deeb}.p{fill:#7fdbca}.c{fill:#ecc48d}.h{fill:#ff6b6b}.m{fill:#f78c6c}.l{fill:#82aaff}.i{fill:#8a96a8}@keyframes t{from{opacity:0}to{opacity:1}}.r{animation:t .01s backwards}.d0{animation-delay:0.40s}.d1{animation-delay:0.75s}.d2{animation-delay:1.10s}.d3{animation-delay:1.45s}.d4{animation-delay:1.80s}.d5{animation-delay:2.15s}.d6{animation-delay:2.50s}.d7{animation-delay:2.85s}.d8{animation-delay:3.20s}.d9{animation-delay:3.55s}.d10{animation-delay:3.90s}.d11{animation-delay:4.25s}.d12{animation-delay:4.60s}.d13{animation-delay:4.95s}.d14{animation-delay:5.30s}.d15{animation-delay:5.65s}</style><rect width="860" height="484" rx="10" fill="#011627"/><rect width="860" height="34" rx="10" fill="#0b2942"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/><text x="430" y="22" text-anchor="middle" class="i">s3-policy-audit</text><text x="20" y="64" xml:space="preserve"><tspan class="p">$ </tspan>target/release/s3-policy-audit examples</text><text class="r d0 " x="20" y="108" xml:space="preserve">4 files, 12 findings</text><text class="r d1 h" x="20" y="130" xml:space="preserve">CRITICAL S3001 policies/public-assets.json#Statement[UploadFromAnywhere]</text><text class="r d2 " x="20" y="152" xml:space="preserve">         anyone can write or delete: Action s3:PutObject, s3:PutObjectAcl</text><text class="r d3 h" x="20" y="174" xml:space="preserve">HIGH     S3005 config/acme-public-assets.json#PublicAccessBlock</text><text class="r d4 " x="20" y="196" xml:space="preserve">         public access block is not fully on: BlockPublicAcls, IgnorePublicAcls, BlockPublicPolicy, Rest</text><text class="r d5 h" x="20" y="218" xml:space="preserve">HIGH     S3009 config/acme-public-assets.json#Acl.Grants[0]</text><text class="r d6 " x="20" y="240" xml:space="preserve">         ACL grants READ to everyone</text><text class="r d7 h" x="20" y="262" xml:space="preserve">HIGH     S3009 config/acme-public-assets.json#Acl.Grants[1]</text><text class="r d8 " x="20" y="284" xml:space="preserve">         ACL grants WRITE to any AWS account</text><text class="r d9 h" x="20" y="306" xml:space="preserve">HIGH     S3001 policies/public-assets.json#Statement[PublicRead]</text><text class="r d10 " x="20" y="328" xml:space="preserve">         anyone on the internet can read: Action s3:GetObject</text><text class="r d11 m" x="20" y="350" xml:space="preserve">MEDIUM   S3006 config/acme-public-assets.json#Encryption</text><text class="r d12 " x="20" y="372" xml:space="preserve">         no default encryption configured</text><text class="r d13 m" x="20" y="394" xml:space="preserve">MEDIUM   S3001 policies/private-data.json#Statement[VpcOnly]</text><text class="r d14 " x="20" y="416" xml:space="preserve">         public principal with a Condition: check that the condition really restricts who can call</text><text class="r d15 m" x="20" y="438" xml:space="preserve">MEDIUM   S3002 policies/public-assets.json#Statement[ReleaseTeam]</text></svg>
